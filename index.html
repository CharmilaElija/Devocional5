<script>
let musicaTocando=false;const audio=document.getElementById('musica');
function toggleMusica(){if(musicaTocando){audio.pause();musicaTocando=false;document.getElementById('btnMusica').innerText='🔊 Música: OFF';}else{audio.play().then(()=>{musicaTocando=true;document.getElementById('btnMusica').innerText='🔈 Música: ON';}).catch(()=>{});}}

const temas={
"😰 Ansiedade":{ref:"Ansiedade",lista:[
{t:"Dia 1 - Entrego minha ansiedade",ver:"Lancem sobre Ele toda a vossa ansiedade, porque Ele tem cuidado de vós. - 1 Pedro 5:7",refl:"Você não precisa carregar o que Deus já prometeu levar.",dec:"Eu, Charmila, lanço hoje toda minha ansiedade sobre Deus, porque Ele cuida de mim.",ora:"Pai, toma minha ansiedade hoje, eu entrego em Tuas mãos."},
{t:"Dia 2 - Paz que excede",ver:"E a paz de Deus, que excede todo entendimento, guardará o vosso coração. - Filipenses 4:7",refl:"A paz de Deus não faz sentido para a lógica, mas guarda seu coração.",dec:"A paz de Deus guarda meu coração e minha mente em Cristo Jesus.",ora:"Me dá Tua paz que eu não consigo entender, Senhor."},
{t:"Dia 3 - Não andem ansiosos",ver:"Não andem ansiosos por coisa alguma, mas em tudo, pela oração, apresentem seus pedidos. - Filipenses 4:6",refl:"Ansiedade diminui quando a oração aumenta.",dec:"Em vez de ficar ansiosa, eu oro e apresento tudo a Deus.",ora:"Hoje escolho orar em vez de me preocupar."},
{t:"Dia 4 - Deus está no controle",ver:"Quando a ansiedade já me dominava, o Teu consolo trouxe alívio à minha alma. - Salmos 94:19",refl:"Seu consolo é maior que sua ansiedade.",dec:"O consolo de Deus traz alívio para minha alma ansiosa.",ora:"Me consola hoje, Espírito Santo."},
{t:"Dia 5 - Descanso",ver:"Venham a mim, todos os que estão cansados e sobrecarregados, e eu vos aliviarei. - Mateus 11:28",refl:"Jesus não te chama para ser forte, Ele te chama para descansar Nele.",dec:"Eu venho a Jesus hoje cansada e recebo descanso.",ora:"Me alivia hoje, Jesus, estou sobrecarregada."},
{t:"Dia 6 - Mente guardada",ver:"Tu conservarás em paz aquele cuja mente está firme em ti. - Isaías 26:3",refl:"Mente firme em Deus = coração em paz.",dec:"Minha mente está firme em Deus e por isso tenho paz perfeita.",ora:"Firma minha mente em Ti hoje."},
{t:"Dia 7 - Não temer o amanhã",ver:"Não vos inquieteis pelo dia de amanhã, basta a cada dia o seu mal. - Mateus 6:34",refl:"Deus te dá força para hoje, não para o mês inteiro.",dec:"Eu vivo o hoje, Deus cuidará do meu amanhã.",ora:"Me ajuda a viver um dia de cada vez."},
{t:"Dia 8 - Deus peleja",ver:"O Senhor pelejará por vós, e vós vos calareis. - Êxodo 14:14",refl:"Pare de lutar com a mente, deixa Deus lutar por você.",dec:"O Senhor peleja por mim enquanto eu descanso.",ora:"Peleja minhas batalhas mentais hoje."},
{t:"Dia 9 - Coração tranquilo",ver:"A paz deixo-vos, a minha paz vos dou. - João 14:27",refl:"Não é qualquer paz, é a paz de Jesus.",dec:"Eu recebo a paz que Jesus deixou para mim.",ora:"Deixa Tua paz no meu coração hoje."},
{t:"Dia 10 - Força na fraqueza",ver:"O meu poder se aperfeiçoa na fraqueza. - 2 Coríntios 12:9",refl:"Quando você diz não aguento, Deus diz: agora Eu entro.",dec:"Na minha fraqueza ansiosa, o poder de Deus se aperfeiçoa.",ora:"Aperfeiçoa Teu poder em mim hoje."},
{t:"Dia 11 - Deus me sustenta",ver:"Sustenta-me conforme a tua promessa e viverei. - Salmos 119:116",refl:"Você não se sustenta sozinha, é sustentada pela promessa.",dec:"Sou sustentada pela promessa de Deus e viverei em paz.",ora:"Me sustenta hoje com Tua promessa."},
{t:"Dia 12 - Socorro presente",ver:"Deus é o nosso refúgio e fortaleza, socorro bem presente na angústia. - Salmos 46:1",refl:"Socorro não demora, Ele é presente na angústia.",dec:"Deus é meu socorro bem presente quando a ansiedade vem.",ora:"Me socorre agora, Senhor, estou angustiada."},
{t:"Dia 13 - Pensamentos cativos",ver:"Levando cativo todo pensamento à obediência de Cristo. - 2 Coríntios 10:5",refl:"Você não é o que pensa, você governa o que pensa.",dec:"Eu levo todo pensamento ansioso cativo a Cristo hoje.",ora:"Me ajuda a governar meus pensamentos hoje."},
{t:"Dia 14 - Noite tranquila",ver:"Em paz me deito e logo pego no sono, porque só Tu me fazes repousar segura. - Salmos 4:8",refl:"Ansiedade rouba sono, mas Deus devolve.",dec:"Eu me deito em paz e durmo porque Deus me faz repousar segura.",ora:"Me faz dormir em paz hoje, Pai."},
{t:"Dia 15 - Quietude",ver:"Aquietai-vos e sabei que eu sou Deus. - Salmos 46:10",refl:"Aquietar não é parar de fazer, é parar de se desesperar.",dec:"Eu me aquieto e sei que Deus é Deus na minha vida.",ora:"Me aquieta por dentro hoje."},
{t:"Dia 16 - Confiança",ver:"Entrega o teu caminho ao Senhor, confia Nele e Ele tudo fará. - Salmos 37:5",refl:"Entregar + confiar = Ele faz.",dec:"Entrego meu caminho ansioso ao Senhor e confio.",ora:"Eu confio meu dia em Tuas mãos."},
{t:"Dia 17 - Renovada",ver:"Mas os que esperam no Senhor renovarão as suas forças. - Isaías 40:31",refl:"Esperar em Deus não cansa, renova.",dec:"Esperando no Senhor, minhas forças são renovadas hoje.",ora:"Renova minhas forças hoje, estou cansada."},
{t:"Dia 18 - Deus me guarda",ver:"O Senhor te guardará de todo mal, guardará a tua alma. - Salmos 121:7",refl:"Você está guardada de todo mal, inclusive da ansiedade.",dec:"O Senhor me guarda de todo mal hoje.",ora:"Guarda minha alma hoje, Senhor."},
{t:"Dia 19 - Respira",ver:"O sopro do Todo-Poderoso me deu vida. - Jó 33:4",refl:"Cada respiração sua é Deus dizendo: continua.",dec:"O sopro de Deus me dá vida e acalma meu peito.",ora:"Sopra sobre mim Teu fôlego de paz."},
{t:"Dia 20 - Luz no fim",ver:"A tristeza pode durar uma noite, mas a alegria vem pela manhã. - Salmos 30:5",refl:"Sua ansiedade tem prazo de validade.",dec:"Minha tristeza e ansiedade não duram para sempre, a alegria vem.",ora:"Traz alegria na minha manhã."},
{t:"Dia 21 - Deus me ouve",ver:"Na minha angústia clamei ao Senhor e Ele me ouviu. - Salmos 120:1",refl:"Seu clamor ansioso não fica sem resposta.",dec:"Quando clamo na angústia, o Senhor me ouve.",ora:"Me ouve hoje, Senhor, estou clamando."},
{t:"Dia 22 - Coração fortalecido",ver:"Espera no Senhor, anima-te e Ele fortalecerá teu coração. - Salmos 27:14",refl:"Coração ansioso fica fraco, mas Deus fortalece.",dec:"Meu coração é fortalecido porque espero no Senhor.",ora:"Fortalece meu coração hoje."},
{t:"Dia 23 - Não estou só",ver:"Ainda que eu ande pelo vale da sombra da morte, Tu estás comigo. - Salmos 23:4",refl:"Vale não é lugar de ficar, é lugar de passar com Deus.",dec:"Mesmo no vale ansioso, Deus está comigo.",ora:"Não me deixa só no vale hoje."},
{t:"Dia 24 - Deus me responde",ver:"Clama a mim e responder-te-ei. - Jeremias 33:3",refl:"Deus não ignora clamor ansioso.",dec:"Eu clamo e Deus me responde com coisas grandes.",ora:"Me responde hoje, Pai."},
{t:"Dia 25 - Mente de Cristo",ver:"Nós temos a mente de Cristo. - 1 Coríntios 2:16",refl:"Você não tem mente ansiosa, você tem mente de Cristo.",dec:"Eu tenho a mente de Cristo, não mente ansiosa.",ora:"Me dá Teus pensamentos hoje."},
{t:"Dia 26 - Deus me acalma",ver:"Ele acalma a tempestade e as ondas se aquietam. - Salmos 107:29",refl:"Se Ele acalma mar, acalma sua mente.",dec:"Deus acalma a tempestade dentro de mim hoje.",ora:"Acalma minha tempestade interna."},
{t:"Dia 27 - Escolhida para paz",ver:"Que a paz de Cristo seja o árbitro em vosso coração. - Colossenses 3:15",refl:"Deixe a paz decidir, não a ansiedade.",dec:"A paz de Cristo é o árbitro do meu coração hoje.",ora:"Deixa Tua paz decidir por mim hoje."},
{t:"Dia 28 - Descanso na alma",ver:"Encontrareis descanso para as vossas almas. - Mateus 11:29",refl:"Jesus não dá só descanso físico, dá descanso na alma.",dec:"Eu encontro descanso para minha alma ansiosa em Jesus.",ora:"Descansa minha alma hoje."},
{t:"Dia 29 - Deus cuida de tudo",ver:"O Senhor cuidará de tudo. - Salmos 138:8",refl:"Não de algumas coisas, de tudo.",dec:"O Senhor cuidará de tudo na minha vida hoje.",ora:"Cuida de tudo que me deixa ansiosa."},
{t:"Dia 30 - Venci a ansiedade",ver:"No mundo tereis aflições, mas tende bom ânimo, eu venci o mundo. - João 16:33",refl:"Jesus já venceu a ansiedade por você na cruz.",dec:"Eu tenho bom ânimo porque Jesus já venceu minha ansiedade.",ora:"Obrigada porque já venceste por mim, Jesus."}
]},
"😨 Medo e Insegurança":{ref:"Medo",lista:[
{t:"Dia 1 - Não temerei",ver:"Não temas, porque eu sou contigo. - Isaías 41:10",refl:"Medo cresce quando você se sente só. Deus diz: estou contigo.",dec:"Não temerei porque Deus é comigo e me fortalece.",ora:"Tira meu medo hoje, estou com medo."},
{t:"Dia 2 - Coragem",ver:"Seja forte e corajosa, não temas. - Josué 1:9",refl:"Coragem não é ausência de medo, é ir com medo mesmo.",dec:"Sou forte e corajosa porque o Senhor vai comigo onde eu for.",ora:"Me faz corajosa hoje."},
{t:"Dia 3 - Amor lança fora medo",ver:"No amor não há medo, o perfeito amor lança fora o medo. - 1 João 4:18",refl:"Quanto mais amor de Deus você recebe, menos medo fica.",dec:"O amor perfeito de Deus lança fora todo medo de mim.",ora:"Me enche do Teu amor para o medo sair."},
{t:"Dia 4 - Deus é meu escudo",ver:"Tu és o meu escudo, a minha glória. - Salmos 3:3",refl:"Escudo não impede ataque, mas impede que te atinja.",dec:"Deus é meu escudo ao redor de mim.",ora:"Me escuda hoje, Pai."},
{t:"Dia 5 - Não desamparada",ver:"Não te deixarei, nem te desampararei. - Hebreus 13:5",refl:"Desamparo é mentira do medo. Verdade é: Ele não te deixa.",dec:"Não sou desamparada, Deus nunca me deixará.",ora:"Me lembra que não estou só."},
{t:"Dia 6 - Luz na escuridão",ver:"O Senhor é a minha luz e a minha salvação, de quem temerei? - Salmos 27:1",refl:"Se Deus é sua luz, escuridão não te assusta.",dec:"O Senhor é minha luz, de quem terei medo?",ora:"Ilumina meus medos hoje."},
{t:"Dia 7 - Força",ver:"Deus não nos deu espírito de medo, mas de poder. - 2 Timóteo 1:7",refl:"Medo não vem de Deus. Poder vem.",dec:"Não tenho espírito de medo, tenho espírito de poder e amor.",ora:"Me dá poder em vez de medo."},
{t:"Dia 8 - Refúgio",ver:"O nome do Senhor é torre forte, o justo se acolhe e está seguro. - Provérbios 18:10",refl:"Torre forte não é para olhar, é para correr para dentro.",dec:"Corro para dentro do nome do Senhor e estou segura.",ora:"Esconde-me na Tua torre hoje."},
{t:"Dia 9 - Guarda",ver:"O Senhor é quem te guarda, é tua sombra à tua direita. - Salmos 121:5",refl:"Sombra anda colada em você. Deus também.",dec:"O Senhor me guarda como sombra à minha direita.",ora:"Me guarda hoje."},
{t:"Dia 10 - Vou passar",ver:"Quando passares pelas águas, estarei contigo. - Isaías 43:2",refl:"Você vai passar, não vai afundar.",dec:"Quando passar por medo profundo, Deus estará comigo.",ora:"Me ajuda a passar por esse medo."},
{t:"Dia 11 - Vitoriosa",ver:"Em todas estas coisas somos mais que vencedores. - Romanos 8:37",refl:"Não é vencedora, é mais que vencedora.",dec:"Sou mais que vencedora sobre todo medo.",ora:"Me faz vencer esse medo hoje."},
{t:"Dia 12 - Paz no medo",ver:"Deixo-vos a paz, a minha paz vos dou, não se turbe o vosso coração. - João 14:27",refl:"Coração turbado acalma com paz de Jesus.",dec:"Meu coração não se turba, tenho paz de Jesus.",ora:"Acalma meu coração turbado."},
{t:"Dia 13 - Deus me levanta",ver:"Ainda que caia, não ficará prostrado, pois o Senhor o sustém. - Salmos 37:24",refl:"Medo derruba, mas Deus sustém para não ficar caída.",dec:"Mesmo que o medo me faça cair, não ficarei prostrada.",ora:"Me sustém se eu cair hoje."},

{t:"Dia 15 - Segura na mão",ver:"Eu, o Senhor teu Deus, te seguro pela tua mão direita. - Isaías 41:13",refl:"Mão de Deus te segurando é mais forte que medo te puxando.",dec:"Deus me segura pela mão direita e diz: não temas.",ora:"Segura minha mão hoje, estou com medo."},

{t:"Dia 17 - Cabeça erguida",ver:"Mas Tu, Senhor, és escudo para mim e quem exalta minha cabeça. - Salmos 3:3",refl:"Medo abaixa cabeça, Deus levanta.",dec:"Deus exalta minha cabeça hoje, não ando com medo.",ora:"Levanta minha cabeça hoje."},
{t:"Dia 18 - Deus luta",ver:"Não tereis que pelejar, o Senhor pelejará por vós. - 2 Crônicas 20:17",refl:"Essa luta contra medo não é sua, é de Deus.",dec:"Não preciso pelejar contra medo, Deus peleja por mim.",ora:"Luta por mim hoje."},
{t:"Dia 19 - Confiança",ver:"Em Deus tenho posto minha confiança, não temerei. - Salmos 56:4",refl:"Confiança em Deus expulsa medo de homem.",dec:"Minha confiança está em Deus, não temerei o que homem faz.",ora:"Aumenta minha confiança em Ti."},
{t:"Dia 20 - Livramento",ver:"O Senhor me livrou de todos os meus medos. - Salmos 34:4",refl:"Se livrou ontem, livra hoje.",dec:"O Senhor me livra de todos os meus medos hoje.",ora:"Me livra desse medo que me paralisa."},
{t:"Dia 21 - Presença",ver:"Eis que estou convosco todos os dias. - Mateus 28:20",refl:"Todos os dias inclui dias de medo.",dec:"Jesus está comigo todos os dias, inclusive hoje com medo.",ora:"Me lembra que estás comigo."},
{t:"Dia 22 - Coragem para avançar",ver:"Esforça-te e tem bom ânimo, o Senhor vai adiante de ti. - Deuteronômio 31:8",refl:"Deus vai na frente abrindo caminho.",dec:"Tenho bom ânimo porque o Senhor vai adiante de mim.",ora:"Vai adiante de mim hoje."},
{t:"Dia 23 - Deus é maior",ver:"Maior é o que está em vós do que o que está no mundo. - 1 João 4:4",refl:"O que está dentro de você é maior que o medo fora.",dec:"Maior é Deus que está em mim do que medo que está no mundo.",ora:"Seja maior em mim que meu medo."},
{t:"Dia 24 - Sem temor do futuro",ver:"Não temerás o terror da noite. - Salmos 91:5",refl:"Noite e dia, você está guardada.",dec:"Não temerei terror de noite nem medo de dia.",ora:"Tira temor do futuro de mim."},

{t:"Dia 30 - Medo vencido",ver:"Sede fortes e corajosos, o Senhor vosso Deus é quem vai convosco. - Deuteronômio 31:6",refl:"Fortes e corajosos porque Deus vai junto.",dec:"Sou forte e corajosa, Deus vai comigo e venci o medo.",ora:"Obrigada porque comigo venceste o medo."}
]},
"💼 Desemprego e Finanças":{ref:"Finanças",lista:[
{t:"Dia 1 - Provedor",ver:"O meu Deus suprirá todas as vossas necessidades segundo Suas riquezas. - Filipenses 4:19",refl:"Seu provedor tem riquezas inesgotáveis.",dec:"Meu Deus suprirá tudo que preciso hoje.",ora:"Supre minha necessidade hoje, Pai."},
{t:"Dia 2 - Porta aberta",ver:"Eis que diante de ti pus uma porta aberta que ninguém pode fechar. - Apocalipse 3:8",refl:"Uma porta de Deus aberta vale mais que mil fechadas.",dec:"Deus põe porta aberta de emprego diante de mim.",ora:"Abre a porta que ninguém fecha."},
{t:"Dia 3 - Trabalho abençoado",ver:"Abençoará o trabalho das tuas mãos. - Deuteronômio 28:12",refl:"Deus abençoa o que sua mão toca.",dec:"O trabalho das minhas mãos é abençoado por Deus.",ora:"Abençoa o que faço com minhas mãos."},
{t:"Dia 4 - Deus multiplica",ver:"O pouco que o justo tem é melhor que a riqueza de muitos. - Salmos 37:16",refl:"Pouco com Deus é muito.",dec:"O pouco que tenho com Deus se multiplica.",ora:"Multiplica meu pouco hoje."},
{t:"Dia 5 - Não mendigarei",ver:"Fui moço e agora sou velho, nunca vi justo desamparado nem sua descendência mendigar pão. - Salmos 37:25",refl:"Justa não mendiga, recebe provisão.",dec:"Nunca serei desamparada nem mendigarei pão.",ora:"Me sustenta sem mendigar."},
{t:"Dia 6 - Deus abre fontes",ver:"Abrirei janelas do céu e derramarei bênção sem medida. - Malaquias 3:10",refl:"Janelas do céu abertas sobre sua vida.",dec:"Janelas do céu estão abertas sobre minhas finanças.",ora:"Abre janelas do céu sobre mim."},
{t:"Dia 7 - Sabedoria para dinheiro",ver:"Se algum tem falta de sabedoria, peça a Deus. - Tiago 1:5",refl:"Dinheiro precisa de sabedoria para ficar.",dec:"Peço sabedoria a Deus para lidar com dinheiro.",ora:"Me dá sabedoria financeira."},
{t:"Dia 8 - Deus restitui",ver:"Restituir-vos-ei os anos que a locusta comeu. - Joel 2:25",refl:"Deus devolve anos e dinheiro perdido.",dec:"Deus me restitui tudo que perdi.",ora:"Restitui meus anos perdidos."},
{t:"Dia 9 - Favor",ver:"Com favor me cercarás como escudo. - Salmos 5:12",refl:"Favor de Deus abre porta que currículo não abre.",dec:"Sou cercada de favor de Deus como escudo no trabalho.",ora:"Me cerca de favor hoje."},
{t:"Dia 10 - Deus me emprega",ver:"Tudo quanto fizer prosperará. - Salmos 1:3",refl:"Você não procura emprego, emprego te procura quando Deus prospera.",dec:"Tudo quanto eu fizer hoje prosperará.",ora:"Faz prosperar meu esforço hoje."},
{t:"Dia 11 - Providência",ver:"O Senhor proverá. - Gênesis 22:14",refl:"No monte do Senhor se proverá.",dec:"No meu monte de dificuldade, o Senhor proverá.",ora:"Proverá para mim hoje."},
{t:"Dia 12 - Dívidas pagas",ver:"O devedor é servo do credor, mas o Senhor liberta. - Provérbios 22:7",refl:"Jesus veio para libertar de toda servidão, inclusive financeira.",dec:"Sou liberta de dívidas, não sou mais serva.",ora:"Me liberta das dívidas."},
{t:"Dia 13 - Ideias de Deus",ver:"É Deus quem te dá força para adquirir riqueza. - Deuteronômio 8:18",refl:"Ideia de Deus vale mais que salário.",dec:"Deus me dá força e ideia para adquirir riqueza.",ora:"Me dá ideia que gera provisão."},
{t:"Dia 14 - Portas de emprego",ver:"Pedi e dar-se-vos-á, buscai e achareis, batei e abrir-se-vos-á. - Mateus 7:7",refl:"Quem bate, porta abre.",dec:"Peço, busco e bato e porta de emprego se abre para mim.",ora:"Estou batendo, abre para mim."},
{t:"Dia 15 - Trabalho digno",ver:"Quem não trabalha, não coma, mas quem trabalha com fidelidade é honrado. - 2 Tessalonicenses 3:10",refl:"Deus honra quem trabalha com fidelidade.",dec:"Meu trabalho fiel é honrado por Deus e por homens.",ora:"Honra meu trabalho fiel."},
{t:"Dia 16 - Deus é meu patrão",ver:"Servi ao Senhor com alegria, porque Ele é quem vos recompensa. - Colossenses 3:23",refl:"Trabalha para Deus, não só para homem.",dec:"Trabalho como para o Senhor e Ele me recompensa.",ora:"Me recompensa hoje, Senhor."},
{t:"Dia 17 - Semente",ver:"Dá semente ao que semeia e pão ao que come. - 2 Coríntios 9:10",refl:"Deus não dá só pão, dá semente para plantar mais.",dec:"Deus me dá semente para semear e pão para comer.",ora:"Me dá semente para multiplicar."},
{t:"Dia 18 - Herança",ver:"O Senhor é a porção da minha herança. - Salmos 16:5",refl:"Sua herança não é só dinheiro, é o próprio Senhor.",dec:"O Senhor é minha herança e minha provisão.",ora:"Sê minha maior herança hoje."},
{t:"Dia 19 - Abundância",ver:"O ladrão veio para roubar, mas eu vim para que tenham vida em abundância. - João 10:10",refl:"Vida abundante inclui área financeira.",dec:"Tenho vida e vida em abundância em minhas finanças.",ora:"Me dá vida abundante."},
{t:"Dia 20 - Deus não atrasa",ver:"Ao seu tempo, o Senhor fará isso acontecer. - Isaías 60:22",refl:"No tempo de Deus, emprego certo aparece.",dec:"No tempo certo, Deus fará acontecer meu emprego.",ora:"Faz acontecer no Teu tempo."},
{t:"Dia 21 - Confiança não no dinheiro",ver:"Não confiem na incerteza das riquezas, mas em Deus. - 1 Timóteo 6:17",refl:"Dinheiro falha, Deus não falha.",dec:"Confio em Deus, não na incerteza do dinheiro.",ora:"Que minha confiança esteja em Ti."},
{t:"Dia 22 - Deus me chama pelo nome",ver:"Chamei-te pelo teu nome, tu és meu. - Isaías 43:1",refl:"Deus te conhece pelo nome na fila do emprego.",dec:"Fui chamada pelo meu nome por Deus, sou Dele e Ele cuida de mim.",ora:"Me chama pelo nome hoje."},
{t:"Dia 23 - Maná diário",ver:"Cada dia colhiam o maná necessário para aquele dia. - Êxodo 16:4",refl:"Deus dá provisão diária, não mensal.",dec:"Hoje tenho maná suficiente para hoje.",ora:"Me dá o pão de hoje."},
{t:"Dia 24 - Deus promove",ver:"É Deus quem exalta e quem abate. - Salmos 75:7",refl:"Promoção vem de Deus, não de homem.",dec:"Deus é quem me exalta e me promove no trabalho.",ora:"Me exalta no tempo certo."},
{t:"Dia 25 - Economia de Deus",ver:"O Senhor é meu pastor e nada me faltará. - Salmos 23:1",refl:"Pastor cuida que ovelha não falte nada.",dec:"O Senhor é meu pastor e nada me faltará financeiramente.",ora:"Não deixa nada me faltar."},
{t:"Dia 26 - Bênção sem tristeza",ver:"A bênção do Senhor enriquece e não traz tristeza. - Provérbios 10:22",refl:"Riqueza de Deus não vem com ansiedade.",dec:"A bênção do Senhor me enriquece sem tristeza.",ora:"Me enriquece com Tua bênção."},
{t:"Dia 27 - Deus supre escondido",ver:"Fizeste chover maná para comer e deste-lhes pão do céu. - Salmos 105:40",refl:"Deus tem pão escondido para você.",dec:"Deus tem pão do céu reservado para mim hoje.",ora:"Me dá pão escondido hoje."},
{t:"Dia 28 - Trabalho com propósito",ver:"Tudo o que fizerdes, fazei-o em nome do Senhor. - Colossenses 3:17",refl:"Trabalho com propósito é adoração.",dec:"Meu trabalho hoje é adoração ao Senhor.",ora:"Recebe meu trabalho como adoração."},
{t:"Dia 29 - Deus abre tesouros",ver:"O Senhor abrirá o seu bom tesouro, o céu. - Deuteronômio 28:12",refl:"Tesouro bom de Deus está aberto sobre você.",dec:"O bom tesouro do céu está aberto sobre minhas finanças.",ora:"Abre Teu bom tesouro sobre mim."},
{t:"Dia 30 - Venci a falta",ver:"Até aqui nos ajudou o Senhor. - 1 Samuel 7:12",refl:"Até aqui Ele ajudou, daqui para frente também vai.",dec:"Até aqui Deus me ajudou financeiramente e continuará.",ora:"Obrigada porque até aqui me sustentaste."}
]},
"🏠 Problemas no Lar":{ref:"Lar",lista:[
{t:"Dia 1 - Lar de paz",ver:"Eu e a minha casa serviremos ao Senhor. - Josué 24:15",refl:"Decisão sua muda clima da casa.",dec:"Eu e minha casa serviremos ao Senhor hoje.",ora:"Minha casa Te servirá."},
{t:"Dia 2 - Pacificadora",ver:"Bem-aventurados os pacificadores. - Mateus 5:9",refl:"Uma pessoa de paz muda casa inteira.",dec:"Sou pacificadora no meu lar hoje.",ora:"Me faz instrumento de paz."},
{t:"Dia 3 - Amor cobre",ver:"O amor cobrirá multidão de pecados. - 1 Pedro 4:8",refl:"Amor não expõe, cobre.",dec:"O amor de Deus em mim cobre toda falta no meu lar.",ora:"Cobre meu lar com amor."},
{t:"Dia 4 - Sabedoria edifica",ver:"A mulher sábia edifica a sua casa. - Provérbios 14:1",refl:"Você edifica ou derruba com palavras.",dec:"Sou mulher sábia que edifica minha casa hoje.",ora:"Me dá sabedoria para edificar."},
{t:"Dia 5 - Deus no centro",ver:"Se o Senhor não edificar a casa, em vão trabalham. - Salmos 127:1",refl:"Casa sem Deus é esforço vão.",dec:"O Senhor edifica minha casa hoje.",ora:"Edifica minha casa, Senhor."},
{t:"Dia 6 - Perdão diário",ver:"Perdoai-vos uns aos outros como Deus vos perdoou. - Efésios 4:32",refl:"Lar sem perdão vira tribunal.",dec:"Perdoo hoje como fui perdoada por Deus.",ora:"Me ajuda a perdoar hoje."},
{t:"Dia 7 - Palavra branda",ver:"A resposta branda desvia o furor. - Provérbios 15:1",refl:"Uma resposta mansa muda briga inteira.",dec:"Minha resposta hoje será branda e desviará furor.",ora:"Põe brandura na minha boca."},
{t:"Dia 8 - Unidade",ver:"Quão bom que os irmãos vivam em união. - Salmos 133:1",refl:"Unidade atrai bênção de Deus.",dec:"Minha casa vive em união hoje.",ora:"Traz união para meu lar."},
{t:"Dia 9 - Presença de Deus",ver:"Onde estiverem dois ou três reunidos em meu nome, ali estou. - Mateus 18:20",refl:"Jesus quer estar no meio da sua casa.",dec:"Jesus está no meio do meu lar hoje.",ora:"Fica no meio da minha casa hoje."},
{t:"Dia 10 - Deus restaura",ver:"Restaurarei os anos que a locusta comeu. - Joel 2:25",refl:"Deus restaura anos perdidos em briga.",dec:"Deus restaura meu lar e meus anos perdidos.",ora:"Restaura meu lar, Senhor."},
{t:"Dia 11 - Lar de oração",ver:"Minha casa será chamada casa de oração. - Mateus 21:13",refl:"Casa que ora, permanece.",dec:"Minha casa é casa de oração hoje.",ora:"Faz minha casa orar."},
{t:"Dia 12 - Respeito mútuo",ver:"Sujeitai-vos uns aos outros no temor de Cristo. - Efésios 5:21",refl:"Respeito não é só pedir, é dar.",dec:"Dou respeito e recebo respeito no meu lar.",ora:"Ensina-nos respeito mútuo."},
{t:"Dia 13 - Alegria no lar",ver:"A alegria do Senhor é a vossa força. - Neemias 8:10",refl:"Casa triste enfraquece, casa alegre fortalece.",dec:"A alegria do Senhor é a força do meu lar.",ora:"Traz alegria para minha casa."},
{t:"Dia 14 - Deus é guardião",ver:"O Senhor guardará tua entrada e saída. - Salmos 121:8",refl:"Guardião da sua casa não dorme.",dec:"O Senhor guarda minha casa e minha família hoje.",ora:"Guarda minha família."},
{t:"Dia 15 - Palavra de bênção",ver:"A morte e a vida estão no poder da língua. - Provérbios 18:21",refl:"Sua língua abençoa ou amaldiçoa seu lar.",dec:"Minha língua hoje só abençoa meu lar.",ora:"Guarda minha língua hoje."},
{t:"Dia 16 - Mansidão",ver:"Bem-aventurados os mansos porque herdarão a terra. - Mateus 5:5",refl:"Mansidão não é fraqueza, é força controlada.",dec:"Sou mansa e herdo paz no meu lar.",ora:"Me dá mansidão hoje."},
{t:"Dia 17 - Deus de paz",ver:"O Deus de paz será convosco. - Filipenses 4:9",refl:"Onde Deus de paz está, confusão sai.",dec:"O Deus de paz está com meu lar hoje.",ora:"Sê o Deus de paz na minha casa."},
{t:"Dia 18 - Reconciliação",ver:"Deixando reconciliar-vos com Deus e uns com os outros. - 2 Coríntios 5:20",refl:"Reconciliação é ponte, não muro.",dec:"Sou ponte de reconciliação no meu lar.",ora:"Me usa para reconciliar."},
{t:"Dia 19 - Lar protegido",ver:"Nenhuma arma forjada contra ti prosperará. - Isaías 54:17",refl:"Arma contra seu lar não prospera.",dec:"Nenhuma arma contra meu lar prosperará hoje.",ora:"Frustra toda arma contra meu lar."},
{t:"Dia 20 - Escuta",ver:"Todo homem seja pronto para ouvir, tardio para falar. - Tiago 1:19",refl:"Ouvir cura mais que falar.",dec:"Hoje sou pronta para ouvir no meu lar.",ora:"Me ensina a ouvir mais."},
{t:"Dia 21 - Honra",ver:"Honra teu pai e tua mãe para que se prolonguem teus dias. - Êxodo 20:12",refl:"Honra atrai longa vida e paz.",dec:"Honro e sou honrada no meu lar hoje.",ora:"Traz honra para minha casa."},
{t:"Dia 22 - Deus cura relacionamento",ver:"E sararei a sua apostasia e os amarei. - Oséias 14:4",refl:"Deus sara relacionamento ferido.",dec:"Deus sara relacionamentos no meu lar hoje.",ora:"Sara o que está ferido em casa."},
{t:"Dia 23 - Gratidão",ver:"Em tudo dai graças. - 1 Tessalonicenses 5:18",refl:"Gratidão muda clima de reclamação.",dec:"Em tudo dou graças pelo meu lar hoje.",ora:"Me dá coração grato pelo meu lar."},
{t:"Dia 24 - Lar de luz",ver:"Vós sois a luz do mundo. - Mateus 5:14",refl:"Sua casa pode ser luz na rua.",dec:"Meu lar é luz do mundo hoje.",ora:"Faz meu lar ser luz."},
{t:"Dia 25 - Deus provê para casa",ver:"O Senhor proverá para sua casa. - Gênesis 22:8",refl:"Provisão para casa vem do Senhor.",dec:"O Senhor provê tudo para minha casa hoje.",ora:"Proverá para minha casa."},
{t:"Dia 26 - Humildade",ver:"Revesti-vos de humildade. - 1 Pedro 5:5",refl:"Humildade evita muita briga.",dec:"Me revisto de humildade no meu lar hoje.",ora:"Me reveste de humildade."},
{t:"Dia 27 - Deus é centro",ver:"Buscai primeiro o Reino e tudo vos será acrescentado. - Mateus 6:33",refl:"Quando Deus é primeiro, resto se ajusta.",dec:"Busco primeiro o Reino e meu lar é acrescentado de paz.",ora:"Sê o primeiro no meu lar."},
{t:"Dia 28 - Lágrimas vistas",ver:"Tu contaste minhas lágrimas, não estão no teu odre? - Salmos 56:8",refl:"Deus vê lágrima que ninguém vê em casa.",dec:"Deus conta minhas lágrimas no meu lar e me consola.",ora:"Vê minhas lágrimas hoje."},
{t:"Dia 29 - Casa firmada na rocha",ver:"Caiu chuva, vieram rios, sopraram ventos, mas não caiu porque estava na rocha. - Mateus 7:25",refl:"Casa na rocha não cai com vento.",dec:"Minha casa está firmada na rocha que é Cristo.",ora:"Firma minha casa na rocha."},
{t:"Dia 30 - Testemunho no lar",ver:"Crê no Senhor Jesus e serás salvo tu e tua casa. - Atos 16:31",refl:"Sua fé alcança sua casa inteira.",dec:"Eu creio e minha casa é salva e abençoada hoje.",ora:"Salva minha casa toda, Jesus."}
]},
"💔 Coração Ferido":{ref:"Coração",lista:[
{t:"Dia 1 - Coração curado",ver:"Ele sara os quebrantados de coração e cura suas feridas. - Salmos 147:3",refl:"Ferida invisível Deus também cura.",dec:"Deus sara meu coração quebrantado hoje.",ora:"Sara meu coração, Pai."},
{t:"Dia 2 - Amada eternamente",ver:"Com amor eterno te amei, com benignidade te atraí. - Jeremias 31:3",refl:"Amor eterno não acaba com rejeição.",dec:"Sou amada com amor eterno de Deus.",ora:"Me faz sentir Teu amor eterno."},
{t:"Dia 3 - Nova criatura",ver:"Se alguém está em Cristo, nova criatura é, tudo se fez novo. - 2 Coríntios 5:17",refl:"Passado não define futuro em Cristo.",dec:"Sou nova criatura, passado não me define mais.",ora:"Faz tudo novo em mim."},
{t:"Dia 4 - Coleciona lágrimas",ver:"Colocaste minhas lágrimas no teu odre. - Salmos 56:8",refl:"Nenhuma lágrima sua é ignorada por Deus.",dec:"Deus recolhe cada lágrima minha.",ora:"Recolhe minhas lágrimas hoje."},
{t:"Dia 5 - Perto dos quebrantados",ver:"Perto está o Senhor dos que têm coração quebrantado. - Salmos 34:18",refl:"Quando coração quebra, Deus chega perto.",dec:"O Senhor está perto de mim com coração quebrantado.",ora:"Fica perto de mim hoje."},
{t:"Dia 6 - Tira coração de pedra",ver:"Tirarei de vós coração de pedra e darei coração de carne. - Ezequiel 36:26",refl:"Coração endurecido pela dor pode voltar a sentir.",dec:"Deus tira meu coração de pedra e me dá coração novo.",ora:"Me dá coração novo, sensível."},
{t:"Dia 7 - Alegria vem",ver:"O choro pode durar uma noite, mas alegria vem pela manhã. - Salmos 30:5",refl:"Noite de choro tem manhã de alegria marcada.",dec:"Meu choro dura uma noite, mas minha alegria vem pela manhã.",ora:"Traz alegria na minha manhã."},
{t:"Dia 8 - Deus me vê",ver:"Tu és o Deus que me vê. - Gênesis 16:13",refl:"No deserto, Deus te vê.",dec:"Sou vista por Deus mesmo no meu deserto.",ora:"Me vê no meu deserto hoje."},
{t:"Dia 9 - Consolo",ver:"Bendito seja o Deus de toda consolação que nos consola. - 2 Coríntios 1:3",refl:"Deus não só consola, Ele é o Deus de toda consolação.",dec:"Recebo consolação de Deus hoje.",ora:"Me consola hoje, Pai."},
{t:"Dia 10 - Não sou esquecida",ver:"Pode uma mãe esquecer seu filho? Ainda que ela esqueça, Eu não me esquecerei de ti. - Isaías 49:15",refl:"Você pode ser esquecida por gente, nunca por Deus.",dec:"Não sou esquecida, Deus nunca se esquece de mim.",ora:"Me lembra que não sou esquecida."},
{t:"Dia 11 - Coração guardado",ver:"Sobre tudo guarda o teu coração. - Provérbios 4:23",refl:"Coração ferido precisa ser guardado para sarar.",dec:"Guardo meu coração hoje em Deus.",ora:"Guarda meu coração ferido."},
{t:"Dia 12 - Deus me levanta",ver:"Ainda que eu caia, me levantarei. - Miquéias 7:8",refl:"Queda não é final, levantar é promessa.",dec:"Ainda que caia ferida, me levantarei em Deus.",ora:"Me levanta hoje."},
{t:"Dia 13 - Amor que não falha",ver:"O amor nunca falha. - 1 Coríntios 13:8",refl:"Amor humano falha, amor de Deus nunca.",dec:"O amor de Deus por mim nunca falha.",ora:"Me mostra Teu amor que não falha."},
{t:"Dia 14 - Cura interior",ver:"Restaura a minha alma. - Salmos 23:3",refl:"Alma ferida precisa de restauração.",dec:"Deus restaura minha alma ferida hoje.",ora:"Restaura minha alma."},
{t:"Dia 15 - Beleza em vez de cinzas",ver:"Dá beleza em vez de cinzas, óleo de alegria em vez de pranto. - Isaías 61:3",refl:"Deus troca cinza por beleza.",dec:"Recebo beleza em vez de cinzas hoje.",ora:"Troca minhas cinzas por beleza."},
{t:"Dia 16 - Deus me escolheu",ver:"Não me escolhestes vós a mim, mas eu vos escolhi. - João 15:16",refl:"Rejeitada por gente, escolhida por Deus.",dec:"Fui escolhida por Deus, mesmo rejeitada por pessoas.",ora:"Me lembra que fui escolhida por Ti."},
{t:"Dia 17 - Ferida tem propósito",ver:"Todas as coisas cooperam para o bem daqueles que amam a Deus. - Romanos 8:28",refl:"Até ferida vai cooperar para seu bem.",dec:"Até minha ferida coopera para meu bem.",ora:"Faz cooperar para meu bem."},
{t:"Dia 18 - Deus enxuga lágrimas",ver:"Enxugará de seus olhos toda lágrima. - Apocalipse 21:4",refl:"Mão de Deus enxuga lágrima que ninguém enxugou.",dec:"Deus enxuga toda lágrima dos meus olhos hoje.",ora:"Enxuga minhas lágrimas hoje."},
{t:"Dia 19 - Esperança viva",ver:"Bendito seja Deus que nos deu viva esperança. - 1 Pedro 1:3",refl:"Esperança viva não morre com decepção.",dec:"Tenho viva esperança em Deus hoje.",ora:"Me dá esperança viva."},
{t:"Dia 20 - Coração em paz",ver:"A paz de Deus guardará vosso coração. - Filipenses 4:7",refl:"Coração ferido precisa de paz como curativo.",dec:"A paz de Deus guarda meu coração ferido hoje.",ora:"Guarda meu coração com paz."},
{t:"Dia 21 - Sou preciosa",ver:"Vós sois preciosos aos meus olhos. - Isaías 43:4",refl:"Você é preciosa, não descartável.",dec:"Sou preciosa aos olhos de Deus.",ora:"Me faz me sentir preciosa."},
{t:"Dia 22 - Deus me carrega",ver:"Até a velhice eu vos carregarei. - Isaías 46:4",refl:"Quando você não anda, Ele te carrega.",dec:"Deus me carrega quando não consigo andar.",ora:"Me carrega hoje, estou sem força."},
{t:"Dia 23 - Novo coração",ver:"Criai em mim um coração puro, ó Deus. - Salmos 51:10",refl:"Deus cria coração novo onde dor estragou.",dec:"Deus cria em mim coração puro hoje.",ora:"Cria coração novo em mim."},
{t:"Dia 24 - Deus me consola no secreto",ver:"Teu Pai que vê em secreto te recompensará. - Mateus 6:6",refl:"Dor no secreto, recompensa no secreto.",dec:"Meu Pai que vê em secreto me consola hoje.",ora:"Me consola no secreto."},
{t:"Dia 25 - Sou filha amada",ver:"Vede quão grande amor nos tem concedido o Pai, sermos chamados filhos. - 1 João 3:1",refl:"Você não é qualquer uma, é filha amada.",dec:"Sou filha amada de Deus hoje.",ora:"Me faz sentir filha amada."},
{t:"Dia 26 - Deus me entende",ver:"Jesus chorou. - João 11:35",refl:"Jesus chorou também, Ele entende sua lágrima.",dec:"Jesus entende minhas lágrimas porque Ele também chorou.",ora:"Obrigada porque me entendes."},
{t:"Dia 27 - Força na dor",ver:"Quando estou fraco, então sou forte. - 2 Coríntios 12:10",refl:"Fraqueza de hoje é força de amanhã.",dec:"Na minha fraqueza de coração, sou forte em Deus.",ora:"Me faz forte na fraqueza."},
{t:"Dia 28 - Deus me restaura",ver:"Restaurai-me e serei restaurada. - Jeremias 17:14",refl:"Restauração vem de Deus, não de pessoas.",dec:"Deus me restaura hoje por completo.",ora:"Me restaura por dentro."},
{t:"Dia 29 - Passado apagado",ver:"Eu apago tuas transgressões e não me lembro mais. - Isaías 43:25",refl:"Deus apaga passado que te condena.",dec:"Meu passado doloroso é apagado por Deus hoje.",ora:"Apaga meu passado doloroso."},
{t:"Dia 30 - Coração curado e pronto",ver:"Deixo-vos curados e livres, saltareis como bezerros. - Malaquias 4:2",refl:"Coração curado volta a saltar de alegria.",dec:"Meu coração está curado e salto de alegria em Deus.",ora:"Obrigada porque me curaste completamente."}
]},
"🙏 Propósito e Fé":{ref:"Propósito",lista:[
{t:"Dia 1 - Planos de paz",ver:"Eu sei os planos que tenho para vocês, planos de paz e não de mal. - Jeremias 29:11",refl:"Seu futuro não é mal, é paz.",dec:"Os planos de Deus para mim são de paz e esperança hoje.",ora:"Mostra Teus planos de paz para mim."},

let temaAtual="😰 Ansiedade";let diaAtual=0;
const catGrid=document.getElementById('catGrid');Object.keys(temas).forEach(k=>{const b=document.createElement('button');b.innerText=k;b.onclick=()=>{temaAtual=k;diaAtual=0;document.querySelectorAll('.cat-grid button').forEach(x=>x.classList.toggle('active',x.innerText===k));montarMenu();mostrar();};if(k===temaAtual)b.classList.add('active');catGrid.appendChild(b);});
function montarMenu(){const menu=document.getElementById('menu');menu.innerHTML='';for(let i=0;i<30;i++){const b=document.createElement('button');b.innerText=i+1;b.onclick=()=>{diaAtual=i;mostrar();};menu.appendChild(b);}}
function mostrar(){const dados=temas[temaAtual];const base=dados.lista[diaAtual];const diaReal=diaAtual+1;document.getElementById('filtroNome').innerText=temaAtual;document.getElementById('contador').innerText='Dia '+diaReal+' de 30';document.getElementById('card').innerHTML='<h2>'+base.t+'</h2><div class="versiculo-small">📖 '+base.ver+'</div><div class="bloco roxo"><div class="label">💭 REFLEXÃO</div>'+base.refl+'</div><div class="bloco"><div class="label">🗣️ DECLARAÇÃO</div>'+base.dec+'</div><div class="bloco rosa"><div class="label">🙏 ORAÇÃO</div>'+base.ora+' Amém.</div><div style="font-size:10px;opacity:.5;margin-top:10px">Charmila Elija • '+temaAtual+' • Dia '+diaReal+'/30</div>';document.querySelectorAll('.menu button').forEach((b,i)=>b.classList.toggle('active',i===diaAtual));localStorage.setItem('temaCharmila',temaAtual);localStorage.setItem('diaCharmila',diaAtual);}
function mudar(d){diaAtual+=d;if(diaAtual<0)diaAtual=29;if(diaAtual>29)diaAtual=0;mostrar();}
let timer=null;function ativar(){const h=document.getElementById('hora').value;if(!h)return alert('Escolhe hora!');if(Notification&&Notification.permission!=='granted')Notification.requestPermission();localStorage.setItem('horaCharmila',h);document.getElementById('status').innerText='✅ Ativo às '+h+' com tudo';if(timer)clearInterval(timer);timer=setInterval(checar,60000);alert('Lembrete ativado às '+h);}
function desativar(){localStorage.removeItem('horaCharmila');if(timer)clearInterval(timer);document.getElementById('status').innerText='❌ Desativado';}
function checar(){const hs=localStorage.getItem('horaCharmila');if(!hs)return;const ag=new Date();const ha=ag.getHours().toString().padStart(2,'0')+':'+ag.getMinutes().toString().padStart(2,'0');if(ha===hs){const dados=temas[temaAtual];const base=dados.lista[diaAtual];const texto='📖 '+base.ver+'\n💭 '+base.refl+'\n🗣️ '+base.dec+'\n🙏 '+base.ora;if(Notification&&Notification.permission==='granted'){new Notification('Devocional '+temaAtual,{body:texto.substring(0,120)+'...',icon:'IMG_9525.jpeg'});}else{alert('💜 DEVOCIONAL '+temaAtual+'\n\n'+texto);}}}
montarMenu();mostrar();
</script></body></html>
